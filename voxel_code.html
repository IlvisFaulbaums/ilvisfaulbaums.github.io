<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI 4-View Voxelizer (U2Net)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; overflow: hidden; display: flex; }
        #sidebar { width: 350px; padding: 20px; background: #161616; border-right: 1px solid #333; z-index: 10; overflow-y: auto; height: 100vh; }
        #viewport { flex-grow: 1; position: relative; }
        video { width: 100%; border-radius: 8px; background: #000; transform: scaleX(-1); }
        .view-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .view-box { background: #222; padding: 5px; border-radius: 4px; text-align: center; font-size: 11px; }
        canvas.preview { width: 100%; height: auto; display: block; margin-top: 5px; background: #000; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        #btnCapture { background: #e91e63; color: white; }
        #btnVoxelize { background: #2196f3; color: white; display: none; }
        .status { color: #888; font-size: 12px; margin-top: 5px; }
        #loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; visibility: hidden; }
    </style>
</head>
<body>

<div id="loading-overlay">Processing AI Segmentation...</div>

<div id="sidebar">
    <h2>4-View Voxelizer</h2>
    <video id="webcam" autoplay playsinline></video>
    <div id="modelStatus" class="status">Loading AI Model...</div>
    
    <button id="btnCapture" disabled>Capture Front (0°)</button>
    
    <div class="view-grid">
        <div class="view-box">Front<canvas id="c0" class="preview"></canvas></div>
        <div class="view-box">Right<canvas id="c1" class="preview"></canvas></div>
        <div class="view-box">Back<canvas id="c2" class="preview"></canvas></div>
        <div class="view-box">Left<canvas id="c3" class="preview"></canvas></div>
    </div>

    <button id="btnVoxelize">Generate 3D Model</button>
    <div class="status">Rotate object 90° between captures. Use a clean background.</div>
</div>

<div id="viewport"></div>

<script>
    let session;
    const views = ["Front", "Right", "Back", "Left"];
    let currentStep = 0;
    const masks = [null, null, null, null];
    const resolution = 64; // Grid size: 64x64x64

    const video = document.getElementById('webcam');
    const btnCapture = document.getElementById('btnCapture');
    const btnVoxelize = document.getElementById('btnVoxelize');
    const modelStatus = document.getElementById('modelStatus');
    const loading = document.getElementById('loading-overlay');

    // 1. Setup Three.js
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth - 350, window.innerHeight);
    document.getElementById('viewport').appendChild(renderer.domElement);
    
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    camera.position.set(100, 100, 100);
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const light = new THREE.DirectionalLight(0xffffff, 0.5);
    light.position.set(10, 20, 10);
    scene.add(light);

    // 2. Load ONNX Model (u2netp)
    async function initAI() {
        try {
            session = await ort.InferenceSession.create('./u2netp.onnx', { executionProviders: ['wasm'] });
            modelStatus.innerText = "AI Model Ready";
            btnCapture.disabled = false;
            
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 320 } });
            video.srcObject = stream;
        } catch (e) {
            modelStatus.innerText = "Error: " + e.message;
            console.error(e);
        }
    }

    // 3. Image Processing (Remove Background)
    async function getMask(inputCanvas) {
        const ctx = inputCanvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, 320, 320);
        
        // Prepare tensor (Normalize to 0-1)
        const input = new Float32Array(3 * 320 * 320);
        for (let i = 0; i < 320 * 320; i++) {
            input[i] = imgData.data[i * 4] / 255;           // R
            input[i + 320 * 320] = imgData.data[i * 4 + 1] / 255; // G
            input[i + 2 * 320 * 320] = imgData.data[i * 4 + 2] / 255; // B
        }

        const tensor = new ort.Tensor('float32', input, [1, 3, 320, 320]);
        const output = await session.run({ input: tensor });
        const maskData = output[Object.keys(output)[0]].data;

        // Downscale to resolution (e.g. 64x64) for space carving
        const miniMask = new Uint8Array(resolution * resolution);
        const scale = 320 / resolution;
        
        for (let y = 0; y < resolution; y++) {
            for (let x = 0; x < resolution; x++) {
                const ox = Math.floor(x * scale);
                const oy = Math.floor(y * scale);
                miniMask[y * resolution + x] = maskData[oy * 320 + ox] > 0.5 ? 1 : 0;
            }
        }
        return miniMask;
    }

    // 4. Capture Event
    btnCapture.onclick = async () => {
        loading.style.visibility = "visible";
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = 320; tempCanvas.height = 320;
        const tctx = tempCanvas.getContext('2d');
        
        // Mirror and draw
        tctx.save();
        tctx.scale(-1, 1);
        tctx.drawImage(video, -320, 0, 320, 320);
        tctx.restore();

        // Run AI on this frame
        const mask = await getMask(tempCanvas);
        masks[currentStep] = mask;

        // Draw preview
        const previewCanvas = document.getElementById(`c${currentStep}`);
        previewCanvas.width = resolution; previewCanvas.height = resolution;
        const pctx = previewCanvas.getContext('2d');
        const pData = pctx.createImageData(resolution, resolution);
        for(let i=0; i<mask.length; i++) {
            const val = mask[i] * 255;
            pData.data[i*4]=val; pData.data[i*4+1]=val; pData.data[i*4+2]=val; pData.data[i*4+3]=255;
        }
        pctx.putImageData(pData, 0, 0);

        currentStep++;
        if (currentStep < 4) {
            btnCapture.innerText = `Capture ${views[currentStep]} (Next)`;
        } else {
            btnCapture.innerText = "All Views Captured";
            btnCapture.disabled = true;
            btnVoxelize.style.display = "block";
        }
        loading.style.visibility = "hidden";
    };

    // 5. Space Carving Logic
    btnVoxelize.onclick = () => {
        // Clear previous meshes
        scene.children = scene.children.filter(c => !c.isInstancedMesh);

        const mesh = new THREE.InstancedMesh(
            new THREE.BoxGeometry(1, 1, 1),
            new THREE.MeshPhongMaterial({ color: 0x44aa88 }),
            Math.pow(resolution, 3)
        );
        const dummy = new THREE.Object3D();
        let count = 0;

        for (let x = 0; x < resolution; x++) {
            for (let y = 0; y < resolution; y++) {
                for (let z = 0; z < resolution; z++) {
                    
                    // The 4-Way Intersection Check
                    const idxFront = y * resolution + x;
                    const idxRight = y * resolution + z;
                    const idxBack  = y * resolution + (resolution - 1 - x);
                    const idxLeft  = y * resolution + (resolution - 1 - z);

                    if (masks[0][idxFront] && masks[1][idxRight] && masks[2][idxBack] && masks[3][idxLeft]) {
                        dummy.position.set(x - resolution/2, (resolution - y) - resolution/2, z - resolution/2);
                        dummy.updateMatrix();
                        mesh.setMatrixAt(count++, dummy.matrix);
                    }
                }
            }
        }
        mesh.count = count;
        scene.add(mesh);
    };

    function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
    }

    window.onresize = () => {
        camera.aspect = (window.innerWidth - 350) / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth - 350, window.innerHeight);
    };

    initAI();
    animate();
</script>
</body>
</html>
