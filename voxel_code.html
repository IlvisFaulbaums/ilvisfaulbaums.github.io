<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invertēts 3D Skeneris (4-View)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 20px; }
        canvas { border: 1px solid #444; background: #000; }
        #threeContainer { width: 100%; height: 500px; background: #000; margin-top: 10px; border: 1px solid #333; }
        #log { margin-top: 10px; background: #222; color: #0f0; padding: 10px; font-family: monospace; border-left: 5px solid #0f0; }
        .controls { margin-bottom: 15px; background: #222; padding: 15px; border-radius: 8px; }
        .previews { display: flex; gap: 8px; margin-top: 10px; }
        .preview-box { text-align: center; font-size: 11px; color: #888; }
        button { padding: 10px 15px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-capture { background: #444; color: white; margin-right: 5px; }
        .btn-capture:enabled { background: #e91e63; }
        #downloadButton { background: #008cff; color: white; display: none; }
    </style>
</head>
<body>
    <h1>Invertēts 3D Skeneris (4 Skati)</h1>

    <div class="controls">
        <video id="video1" autoplay width="128" height="128" style="transform: scaleX(-1); border: 2px solid #555;"></video>
        <canvas id="canvasOnnx" width="128" height="128"></canvas>
        <p><i>Instrukcija: Uzņemiet 4 kadrus, pagriežot objektu par 90° pēc katra kadra.</i></p>
        
        <button id="btn0" class="btn-capture">1. Priekša (0°)</button>
        <button id="btn1" class="btn-capture" disabled>2. Sāns (90°)</button>
        <button id="btn2" class="btn-capture" disabled>3. Aizmugure (180°)</button>
        <button id="btn3" class="btn-capture" disabled>4. Otrs sāns (270°)</button>
        
        <button id="downloadButton">Ģenerēt INVERTĒTU mākoni</button>
    </div>

    <label>Punktu blīvums/izmērs: </label>
    <input type="range" id="thresholdSlider" min="1" max="15" value="4">

    <div class="previews">
        <div class="preview-box">F (0°)<br><canvas id="p0" width="64" height="64"></canvas></div>
        <div class="preview-box">R (90°)<br><canvas id="p1" width="64" height="64"></canvas></div>
        <div class="preview-box">B (180°)<br><canvas id="p2" width="64" height="64"></canvas></div>
        <div class="preview-box">L (270°)<br><canvas id="p3" width="64" height="64"></canvas></div>
    </div>

    <div id="log">Info: Gaida modeli...</div>
    <div id="threeContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.min.js"></script>

    <script>
        const video = document.getElementById('video1');
        const log = document.getElementById('log');
        const thresholdSlider = document.getElementById('thresholdSlider');
        
        let session;
        let masks = [null, null, null, null];
        let colors = [null, null, null, null];

        // 1. Ielādējam ONNX modeli (u2netp_128.onnx)
        window.onload = async function() {
            try {
                session = await ort.InferenceSession.create('./u2netp_128.onnx', {
                    executionProviders: ['wasm']
                });
                logMessage("Modelis ielādēts. Uzņemiet pirmo skatu.");
                startVideoStream();
            } catch (e) {
                logMessage("Kļūda: " + e.message);
            }
        };

        function logMessage(msg) { log.textContent = "Info: " + msg; }

        async function startVideoStream() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 128, height: 128 } });
            video.srcObject = stream;
        }

        // 2. AI Apstrāde (Invertēta krāsu loģika maskai)
        async function runAI() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 128; tempCanvas.height = 128;
            const tctx = tempCanvas.getContext('2d');
            tctx.save(); tctx.scale(-1, 1); tctx.drawImage(video, -128, 0, 128, 128); tctx.restore();
            
            const imgData = tctx.getImageData(0, 0, 128, 128);
            const floatArr = new Float32Array(128 * 128 * 3);
            
            for (let i = 0, j = 0; i < imgData.data.length; i += 4, j++) {
                floatArr[j] = (imgData.data[i] / 255 - 0.485) / 0.229;
                floatArr[j + 16384] = (imgData.data[i + 1] / 255 - 0.456) / 0.224;
                floatArr[j + 32768] = (imgData.data[i + 2] / 255 - 0.406) / 0.225;
            }

            const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, 128, 128]);
            const results = await session.run({ "input.1": inputTensor });
            const pred = Object.values(results)[0].data;

            const maskArr = new Uint8Array(128 * 128);
            const minVal = Math.min(...pred);
            const maxVal = Math.max(...pred);
            const threshold = (maxVal - minVal) * 0.5 + minVal;

            for (let i = 0; i < pred.length; i++) {
                // Saglabājam bināru masku: 255 (Balts = Fons), 0 (Melns = Objekts)
                maskArr[i] = pred[i] < threshold ? 255 : 0; 
            }

            // Parādām masku uz galvenā ONNX kanvasa
            const finalCtx = document.getElementById("canvasOnnx").getContext("2d");
            const finalImgData = finalCtx.createImageData(128, 128);
            for(let i=0; i<maskArr.length; i++) {
                const v = maskArr[i];
                finalImgData.data[i*4]=v; finalImgData.data[i*4+1]=v; finalImgData.data[i*4+2]=v; finalImgData.data[i*4+3]=255;
            }
            finalCtx.putImageData(finalImgData, 0, 0);

            return { mask: maskArr, color: imgData };
        }

        // 3. Uzņemšanas soļi
        [0, 1, 2, 3].forEach(i => {
            document.getElementById(`btn${i}`).onclick = async () => {
                logMessage(`Apstrādā ${i+1}. skatu...`);
                const result = await runAI();
                masks[i] = result.mask;
                colors[i] = result.color;

                const pCtx = document.getElementById(`p${i}`).getContext('2d');
                pCtx.drawImage(document.getElementById("canvasOnnx"), 0, 0, 64, 64);

                document.getElementById(`btn${i}`).disabled = true;
                if(i < 3) {
                    document.getElementById(`btn${i+1}`).disabled = false;
                    logMessage(`Pagrieziet objektu par 90 grādiem!`);
                } else {
                    document.getElementById('downloadButton').style.display = 'inline-block';
                    logMessage(`Visi skati gatavi. Spiediet ģenerēt.`);
                }
            };
        });

        // 4. INVERTĒTĀ 4-skatu loģika
        function generateInvertedCloud() {
            const commonPoints = [];
            const skip = 1; // Var palielināt uz 2, lai strādātu ātrāk

            for (let y = 0; y < 128; y += skip) {
                for (let x = 0; x < 128; x += skip) {
                    for (let z = 0; z < 128; z += skip) {
                        
                        // !!! INVERTĒTĀ PĀRBAUDE !!!
                        // Mēs pārbaudām, vai maskā ir 255 (BALTS). 
                        // Tas nozīmē, ka punkts tiks ģenerēts visur, IZŅEMOT objektu.
                        const isFront = masks[0][y * 128 + x] === 255;
                        const isRight = masks[1][y * 128 + z] === 255;
                        const isBack  = masks[2][y * 128 + (127 - x)] === 255;
                        const isLeft  = masks[3][y * 128 + (127 - z)] === 255;

                        // Tikai ja visos četros skatos šī vieta ir "tukša" (fons), mēs tur liekam punktu
                        if (isFront && isRight && isBack && isLeft) {
                            const idx = (y * 128 + x) * 4;
                            commonPoints.push({
                                x: x - 64, 
                                y: 64 - y, 
                                z: z - 64, 
                                r: colors[0].data[idx], 
                                g: colors[0].data[idx+1], 
                                b: colors[0].data[idx+2]
                            });
                        }
                    }
                }
            }
            return commonPoints;
        }

        // 5. Vizualizācija un PLY fails
        document.getElementById('downloadButton').onclick = () => {
            const pts = generateInvertedCloud();
            logMessage(`Ģenerēti ${pts.length} invertēti punkti.`);
            
            // Vizualizēt
            const container = document.getElementById('threeContainer');
            container.innerHTML = '';
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const pos = []; const col = [];
            pts.forEach(p => {
                pos.push(p.x * 5, p.y * 5, p.z * 5);
                col.push(p.r / 255, p.g / 255, p.b / 255);
            });
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));

            const mat = new THREE.PointsMaterial({ vertexColors: true, size: thresholdSlider.value, sizeAttenuation: false });
            const cloud = new THREE.Points(geometry, mat);
            scene.add(cloud);
            camera.position.z = 500;

            function animate() { requestAnimationFrame(animate); cloud.rotation.y += 0.005; renderer.render(scene, camera); }
            animate();

            // Lejupielādēt
            let ply = `ply\nformat ascii 1.0\nelement vertex ${pts.length}\nproperty float x\nproperty float y\nproperty float z\nproperty uchar red\nproperty uchar green\nproperty uchar blue\nend_header\n`;
            ply += pts.map(p => `${p.x} ${p.y} ${p.z} ${p.r} ${p.g} ${p.b}`).join('\n');
            const link = document.createElement('a');
            link.href = URL.createObjectURL(new Blob([ply], {type: 'text/plain'}));
            link.download = 'invertets_modelis.ply';
            link.click();
        };
    </script>
</body>
</html>
