<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Skeneris ar diviem leņķiem</title>
    <style>
        canvas { border: 1px solid black; }
        #threeContainer { width: 100%; height: 500px; border: 1px solid #ccc; }
        #log { margin-top: 10px; font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 10px; border: 1px solid #ccc; }
        .controls { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .section { margin: 10px 0; padding: 10px; border: 1px solid #eee; background: white; }
        button { padding: 8px 15px; margin: 2px; cursor: pointer; }
        input[type="range"] { width: 150px; }
        .capture-area { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .point-info { background: #eef; padding: 5px; margin: 5px 0; }
        .view-group { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 5px; }
        .rotation-controls { background: #ffe6e6; padding: 10px; margin: 5px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>3D Skeneris ar diviem leņķiem</h1>
    
    <div class="section">
        <div class="capture-area">
            <video id="video1" autoplay width="128" height="128"></video>
            <canvas id="canvasZY" width="128" height="128"></canvas>
            <canvas id="canvasOnnx" width="128" height="128"></canvas>
            <canvas id="canvas1" width="0" height="0"></canvas>
            <canvas id="canvas2" width="0" height="0"></canvas>
        </div>
    </div>

    <div class="section">
        <div class="view-group">
            <h3>1. Punktu mākonis (90° leņķis)</h3>
            <div class="controls">
                <button id="xyButton1">XY (0°)</button>
                <button id="zyButton1">ZY (90°)</button>
                <button id="generateCloud1">Ģenerēt 1. mākoni</button>
            </div>
            <div class="point-info">1. mākonis: <span id="pointCount1">0</span> punkti</div>
        </div>

        <div class="view-group">
            <h3>2. Punktu mākonis (45° leņķis)</h3>
            <div class="controls">
                <button id="xyButton2">XY (45°)</button>
                <button id="zyButton2">ZY (135°)</button>
                <button id="generateCloud2">Ģenerēt 2. mākoni</button>
            </div>
            <div class="point-info">2. mākonis: <span id="pointCount2">0</span> punkti</div>
        </div>

        <div class="controls">
            <button id="combineClouds">Apvienot mākoņus</button>
            <button id="resetButton">Sākt no jauna</button>
            <button id="downloadButton">Lejupielādēt</button>
        </div>
        
        <div class="point-info">
            <strong>Kopā punkti: <span id="totalPoints">0</span></strong>
        </div>
    </div>

    <div class="section">
        <div class="rotation-controls">
            <h3>2. Mākoņa rotācijas kontrole</h3>
            <div class="controls">
                <label for="cloud2RotationX">Rotācija ap X asi: </label>
                <input type="range" id="cloud2RotationX" min="-3.14" max="3.14" value="0" step="0.01">
                <span id="cloud2RotationXValue">0.00</span> rad
            </div>
            <div class="controls">
                <label for="cloud2RotationZ">Rotācija ap Z asi: </label>
                <input type="range" id="cloud2RotationZ" min="-3.14" max="3.14" value="0" step="0.01">
                <span id="cloud2RotationZValue">0.00</span> rad
            </div>
            <div class="controls">
                <button id="resetRotation">Atiestatīt rotāciju</button>
            </div>
        </div>

        <div class="controls">
            <label for="thresholdSlider">Punktu lielums: </label>
            <input type="range" id="thresholdSlider" min="0.5" max="10" value="3">
            <span id="thresholdValue">3</span>
        </div>
    </div>

    <div id="log">Info: Sagatavojieties uzņemt attēlus...</div>
    
    <div id="threeContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.min.js" defer></script>
    
    <script>
        // Get references to DOM elements
        const video1 = document.getElementById('video1');
        const canvas1 = document.getElementById('canvas1');
        const ctx1 = canvas1.getContext('2d');
        const downloadButton = document.getElementById('downloadButton');
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValue = document.getElementById('thresholdValue');
        const threeContainer = document.getElementById('threeContainer');
        const log = document.getElementById('log');
        const finalCanvas = document.getElementById("canvasOnnx");
        const finalCtx = finalCanvas.getContext("2d");
        const resetButton = document.getElementById('resetButton');
        
        // View 1 buttons
        const xyButton1 = document.getElementById('xyButton1');
        const zyButton1 = document.getElementById('zyButton1');
        const generateCloud1 = document.getElementById('generateCloud1');
        
        // View 2 buttons
        const xyButton2 = document.getElementById('xyButton2');
        const zyButton2 = document.getElementById('zyButton2');
        const generateCloud2 = document.getElementById('generateCloud2');
        
        // Combine button
        const combineClouds = document.getElementById('combineClouds');
        
        // Point counters
        const pointCount1 = document.getElementById('pointCount1');
        const pointCount2 = document.getElementById('pointCount2');
        const totalPoints = document.getElementById('totalPoints');
        
        // Rotation controls
        const cloud2RotationX = document.getElementById('cloud2RotationX');
        const cloud2RotationXValue = document.getElementById('cloud2RotationXValue');
        const cloud2RotationZ = document.getElementById('cloud2RotationZ');
        const cloud2RotationZValue = document.getElementById('cloud2RotationZValue');
        const resetRotation = document.getElementById('resetRotation');
        
        const canvas2 = document.getElementById('canvasZY');
        const ctx2 = canvas2.getContext('2d');
        const canvasZY = document.getElementById('canvasZY');
        const ctxZY = canvasZY.getContext('2d');
        
        let session;
        let view1Data = { pointsXY: [], pointsZY: [], savedXYData: null, savedZYData: null, angle: 90 };
        let view2Data = { pointsXY: [], pointsZY: [], savedXYData: null, savedZYData: null, angle: 45 };
        let pointCloud1 = [];
        let pointCloud2 = [];
        let combinedPointCloud = [];
        let scene, camera, renderer, controls, pointCloudGroup, pointCloudObject1, pointCloudObject2, material1, material2;
        let cloud2RotX = 0;
        let cloud2RotZ = 0;

        // Update slider displays
        thresholdSlider.addEventListener('input', () => {
            thresholdValue.textContent = thresholdSlider.value;
            if (material1) material1.size = parseFloat(thresholdSlider.value);
            if (material2) material2.size = parseFloat(thresholdSlider.value);
        });

        cloud2RotationX.addEventListener('input', () => {
            cloud2RotX = parseFloat(cloud2RotationX.value);
            cloud2RotationXValue.textContent = cloud2RotX.toFixed(2);
            if (pointCloudObject2) {
                pointCloudObject2.rotation.x = cloud2RotX;
            }
        });

        cloud2RotationZ.addEventListener('input', () => {
            cloud2RotZ = parseFloat(cloud2RotationZ.value);
            cloud2RotationZValue.textContent = cloud2RotZ.toFixed(2);
            if (pointCloudObject2) {
                pointCloudObject2.rotation.z = cloud2RotZ;
            }
        });

        resetRotation.addEventListener('click', () => {
            cloud2RotX = 0;
            cloud2RotZ = 0;
            cloud2RotationX.value = 0;
            cloud2RotationZ.value = 0;
            cloud2RotationXValue.textContent = '0.00';
            cloud2RotationZValue.textContent = '0.00';
            if (pointCloudObject2) {
                pointCloudObject2.rotation.x = 0;
                pointCloudObject2.rotation.z = 0;
            }
        });

        // ONNX model loading
        window.onload = async function() {
            try {
                session = await ort.InferenceSession.create('./u2netp_128.onnx', {
                    executionProviders: ['wasm']
                });
                console.log("Model loaded successfully");
                logMessage("ONNX modelis ielādēts veiksmīgi");
            } catch (error) {
                console.error("Error loading model:", error);
                logMessage("Kļūda ielādējot modeli: " + error.message);
            }
        };

        // Background removal function (same as original)
        async function bgRemoval() {
            if (!session) {
                console.error("ONNX model is not loaded yet.");
                return;
            }

            const canvas = document.getElementById("canvasZY");
            const ctx = canvas.getContext("2d");
            const imageData = ctx.getImageData(0, 0, 128, 128);

            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');
            offscreenCanvas.width = 128;
            offscreenCanvas.height = 128;
            offscreenCtx.putImageData(imageData, 0, 0);
            
            const resizedCanvas = document.createElement('canvas');
            const resizedCtx = resizedCanvas.getContext('2d');
            resizedCanvas.width = 128;
            resizedCanvas.height = 128;
            resizedCtx.drawImage(offscreenCanvas, 0, 0, 128, 128, 0, 0, 128, 128);

            const resizedImageData = resizedCtx.getImageData(0, 0, 128, 128).data;

            const floatArr = new Float32Array(128 * 128 * 3);
            for (let i = 0, j = 0; i < resizedImageData.length; i += 4, j++) {
                floatArr[j] = (resizedImageData[i] / 255 - 0.485) / 0.229;
                floatArr[j + 16384] = (resizedImageData[i + 1] / 255 - 0.456) / 0.224;
                floatArr[j + 32768] = (resizedImageData[i + 2] / 255 - 0.406) / 0.225;
            }

            const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, 128, 128]);
            const feeds = { "input.1": inputTensor };

            const results = await session.run(feeds);
            const pred = Object.values(results)[0];

            const intermediateCanvas = document.createElement('canvas');
            const intermediateCtx = intermediateCanvas.getContext('2d');
            intermediateCanvas.width = 128;
            intermediateCanvas.height = 128;
            const myImageData = intermediateCtx.createImageData(128, 128);
            const minVal = Math.min(...pred.data);
            const maxVal = Math.max(...pred.data);
            const threshold = (maxVal - minVal) * 0.5 + minVal;

            for (let i = 0; i < pred.data.length; i++) {
                const value = pred.data[i];
                const color = value < threshold ? 255 : 0;
                myImageData.data[i * 4] = color;
                myImageData.data[i * 4 + 1] = color;
                myImageData.data[i * 4 + 2] = color;
                myImageData.data[i * 4 + 3] = 255;
            }

            intermediateCtx.putImageData(myImageData, 0, 0);

            finalCanvas.width = 128;
            finalCanvas.height = 128;
            finalCtx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);
            finalCtx.drawImage(intermediateCanvas, 0, 0, 128, 128, 0, 0, finalCanvas.width, finalCanvas.height);
        }

        function isMobile() {
            return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
        }

        function logMessage(message) {
            log.textContent = `${message}`;
            log.scrollTop = log.scrollHeight;
        }

        async function startVideoStream() {
            const constraints = {
                video: isMobile() ? { facingMode: { exact: "environment" } } : true
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video1.srcObject = stream;
                processFrame();
            } catch (err) {
                console.error('Error accessing the camera: ', err);
                logMessage('Kļūda piekļūstot kamerai: ' + err.message);
            }
        }

        // Capture and process the frame in real-time
        function processFrame() {
            requestAnimationFrame(processFrame);
            ctx1.drawImage(video1, 0, 0, 128, 128);
            ctx2.drawImage(video1, 0, 0, 128, 128);
            ctxZY.drawImage(video1, 0, 0, 128, 128);
        }

        // Process XY plane for view 1 (0°)
        xyButton1.addEventListener('click', async () => {
            console.log('bg removal!');
            await bgRemoval();
            view1Data.savedXYData = ctx2.getImageData(0, 0, 128, 128);
            processXY(view1Data);
            logMessage("1. mākonis: XY attēls (0°) procesēts");
        });

        // Process ZY plane for view 1 (90°)
        zyButton1.addEventListener('click', async () => {
            console.log('bg removal!');
            await bgRemoval();
            view1Data.savedZYData = ctx2.getImageData(0, 0, 128, 128);
            processZY(view1Data);
            logMessage("1. mākonis: ZY attēls (90°) procesēts");
        });

        // Process XY plane for view 2 (45°)
        xyButton2.addEventListener('click', async () => {
            console.log('bg removal!');
            await bgRemoval();
            view2Data.savedXYData = ctx2.getImageData(0, 0, 128, 128);
            processXY(view2Data);
            logMessage("2. mākonis: XY attēls (45°) procesēts");
        });

        // Process ZY plane for view 2 (135°)
        zyButton2.addEventListener('click', async () => {
            console.log('bg removal!');
            await bgRemoval();
            view2Data.savedZYData = ctx2.getImageData(0, 0, 128, 128);
            processZY(view2Data);
            logMessage("2. mākonis: ZY attēls (135°) procesēts");
        });

        // Function to process XY plane (same as original)
        function processXY(viewData) {
            const imgData = finalCtx.getImageData(0, 0, 128, 128);
            viewData.pointsXY = new Array(128).fill().map(() => new Array(128).fill(false));

            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const pixelIndex = (y * 128 + x) * 4;
                    if (imgData.data[pixelIndex] === 0) {
                        for (let z = 0; z < 128; z++) {
                            viewData.pointsXY[x][y] = true;
                        }
                    }
                }
            }
        }

        // Function to process ZY plane (same as original)
        function processZY(viewData) {
            const imgData = finalCtx.getImageData(0, 0, 128, 128);
            viewData.pointsZY = new Array(128).fill().map(() => new Array(128).fill(false));

            for (let y = 0; y < 128; y++) {
                for (let z = 0; z < 128; z++) {
                    const pixelIndex = (y * 128 + z) * 4;
                    if (imgData.data[pixelIndex] === 0) {
                        for (let x = 0; x < 128; x++) {
                            viewData.pointsZY[z][y] = true;
                        }
                    }
                }
            }
        }

        // Generate point cloud for view 1 (90°)
        generateCloud1.addEventListener('click', () => {
            pointCloud1 = findCommonPoints(view1Data);
            pointCount1.textContent = pointCloud1.length;
            logMessage(`1. punktu mākonis izveidots: ${pointCloud1.length} punkti (90° leņķis)`);
            visualizePointClouds();
        });

        // Generate point cloud for view 2 (45°)
        generateCloud2.addEventListener('click', () => {
            pointCloud2 = findCommonPoints(view2Data);
            pointCount2.textContent = pointCloud2.length;
            logMessage(`2. punktu mākonis izveidots: ${pointCloud2.length} punkti (45° leņķis)`);
            visualizePointClouds();
        });

        // Combine both point clouds
        combineClouds.addEventListener('click', () => {
            if (pointCloud1.length === 0 && pointCloud2.length === 0) {
                logMessage("Vispirms izveidojiet vismaz vienu punktu mākoni");
                return;
            }
            
            combinedPointCloud = [...pointCloud1, ...pointCloud2];
            totalPoints.textContent = combinedPointCloud.length;
            logMessage(`Punktu mākoņi apvienoti: ${combinedPointCloud.length} punkti`);
            visualizePointClouds();
        });

        // Same as original findCommonPoints function
        function findCommonPoints(viewData) {
            const commonPoints = [];
            const colorDataXY = viewData.savedXYData;
            const colorDataZY = viewData.savedZYData;
            const pointsXY = viewData.pointsXY;
            const pointsZY = viewData.pointsZY;

            if (!colorDataXY || !colorDataZY) {
                logMessage("Nav datu no XY un ZY attēliem.");
                return commonPoints;
            }

            let sumX = 0, sumY = 0, sumZ = 0, count = 0;

            // Use lower resolution for simpler point cloud
            const step = 4; // Process every 4th point to reduce density
            
            for (let x = 0; x < 128; x += step) {
                for (let y = 0; y < 128; y += step) {
                    for (let z = 0; z < 128; z += step) {
                        if (pointsXY[x][y] && pointsZY[z][y]) {
                            const pixelIndexXY = (y * 128 + x) * 4;
                            const pixelIndexZY = (y * 128 + z) * 4;

                            // Get colors from both XY and ZY saved image data
                            const rZY = colorDataXY.data[pixelIndexXY];
                            const gZY = colorDataXY.data[pixelIndexXY + 1];
                            const bZY = colorDataXY.data[pixelIndexXY + 2];

                            const rXY = colorDataZY.data[pixelIndexZY];
                            const gXY = colorDataZY.data[pixelIndexZY + 1];
                            const bXY = colorDataZY.data[pixelIndexZY + 2];

                            // Average the colors from XY and ZY planes
                            const r = Math.floor((rXY + rZY) / 2);
                            const g = Math.floor((gXY + gZY) / 2);
                            const b = Math.floor((bXY + bZY) / 2);

                            // Add point to commonPoints
                            commonPoints.push({ x, y, z, color: { r, g, b } });

                            // Sum the coordinates for averaging later
                            sumX += x;
                            sumY += y;
                            sumZ += z;
                            count++;
                        }
                    }
                }
            }

            // Calculate the average coordinates
            if (count > 0) {
                const avgX = sumX / count;
                const avgY = sumY / count;
                const avgZ = sumZ / count;

                // Adjust points to center at (0, 0, 0)
                for (let i = 0; i < commonPoints.length; i++) {
                    commonPoints[i].x -= avgX;
                    commonPoints[i].y -= avgY;
                    commonPoints[i].z -= avgZ;
                }
            }

            return commonPoints;
        }

        // Reset everything
        resetButton.addEventListener('click', () => {
            view1Data = { pointsXY: [], pointsZY: [], savedXYData: null, savedZYData: null, angle: 90 };
            view2Data = { pointsXY: [], pointsZY: [], savedXYData: null, savedZYData: null, angle: 45 };
            pointCloud1 = [];
            pointCloud2 = [];
            combinedPointCloud = [];
            pointCount1.textContent = '0';
            pointCount2.textContent = '0';
            totalPoints.textContent = '0';
            threeContainer.innerHTML = '';
            logMessage("Visi dati notīrīti. Sāciet no jauna.");
        });

        // Download and visualize the point cloud
        downloadButton.addEventListener('click', () => {
            const pointsToUse = combinedPointCloud.length > 0 ? combinedPointCloud : 
                              pointCloud1.length > 0 ? pointCloud1 : 
                              pointCloud2.length > 0 ? pointCloud2 : [];
            
            if (pointsToUse.length === 0) {
                logMessage("Nav punktu, ko lejupielādēt. Vispirms izveidojiet punktu mākoni.");
                return;
            }

            downloadPointCloud(pointsToUse);
        });

        function downloadPointCloud(points) {
            // Start building the PLY header
            let plyData = `ply\n`;
            plyData += `format ascii 1.0\n`;
            plyData += `element vertex ${points.length}\n`;
            plyData += `property float x\n`;
            plyData += `property float y\n`;
            plyData += `property float z\n`;
            plyData += `property uchar red\n`;
            plyData += `property uchar green\n`;
            plyData += `property uchar blue\n`;
            plyData += `end_header\n`;

            // Add each point with color
            points.forEach(point => {
                const { x, y, z, color } = point;
                // Format each line: x y z r g b
                plyData += `${x} ${-y} ${z} ${color.r} ${color.g} ${color.b}\n`;
            });

            // Create a Blob and initiate download
            const blob = new Blob([plyData], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '3dPunkti.ply';
            link.click();

            logMessage(`Lejupielādēts fails ar ${points.length} punktiem`);
        }

        function visualizePointClouds() {
            threeContainer.innerHTML = '';
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            camera = new THREE.PerspectiveCamera(75, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
            threeContainer.appendChild(renderer.domElement);

            // Add OrbitControls for manual camera control
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 10;
            controls.maxDistance = 500;
            controls.maxPolarAngle = Math.PI;

            // Create group for all point clouds
            pointCloudGroup = new THREE.Group();
            scene.add(pointCloudGroup);

            // Create first point cloud (90° angle) - FIXED position
            if (pointCloud1.length > 0) {
                const geometry1 = new THREE.BufferGeometry();
                const vertices1 = [];
                const colors1 = [];

                pointCloud1.forEach(point => {
                    const { x, y, z, color } = point;
                    vertices1.push(x * 2, -y * 2, z * 2);
                    colors1.push(color.r / 255, color.g / 255, color.b / 255);
                });

                geometry1.setAttribute('position', new THREE.Float32BufferAttribute(vertices1, 3));
                geometry1.setAttribute('color', new THREE.Float32BufferAttribute(colors1, 3));

                material1 = new THREE.PointsMaterial({ 
                    vertexColors: true, 
                    size: parseFloat(thresholdSlider.value), 
                    sizeAttenuation: false 
                });
                
                pointCloudObject1 = new THREE.Points(geometry1, material1);
                // First cloud stays fixed at center
                pointCloudObject1.position.set(0, 0, 0);
                pointCloudGroup.add(pointCloudObject1);
            }

            // Create second point cloud (45° angle) - Can be rotated around first cloud
            if (pointCloud2.length > 0) {
                const geometry2 = new THREE.BufferGeometry();
                const vertices2 = [];
                const colors2 = [];

                pointCloud2.forEach(point => {
                    const { x, y, z, color } = point;
                    vertices2.push(x * 2, -y * 2, z * 2);
                    colors2.push(color.r / 255, color.g / 255, color.b / 255);
                });

                geometry2.setAttribute('position', new THREE.Float32BufferAttribute(vertices2, 3));
                geometry2.setAttribute('color', new THREE.Float32BufferAttribute(colors2, 3));

                material2 = new THREE.PointsMaterial({ 
                    vertexColors: true, 
                    size: parseFloat(thresholdSlider.value), 
                    sizeAttenuation: false,
                    color: 0x8888ff // Slightly different color for second cloud
                });
                
                pointCloudObject2 = new THREE.Points(geometry2, material2);
                // Position second cloud slightly offset from first cloud
                pointCloudObject2.position.set(30, 0, 0);
                pointCloudGroup.add(pointCloudObject2);
            }

            // Add coordinate axes for better orientation
            const axesHelper = new THREE.AxesHelper(50);
            scene.add(axesHelper);

            // Add grid for reference
            const gridHelper = new THREE.GridHelper(100, 20);
            scene.add(gridHelper);

            // Better camera position
            camera.position.set(100, 100, 200);
            camera.lookAt(0, 0, 0);
            controls.update();

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            const totalPointsCount = pointCloud1.length + pointCloud2.length;
            logMessage(`Vizualizācija: ${pointCloud1.length} + ${pointCloud2.length} = ${totalPointsCount} punkti. 2. mākonis rotējams ap X un Z asīm.`);
        }

        // Start video stream
        startVideoStream();
    </script>
</body>
</html>
