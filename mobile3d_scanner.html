<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vienkāršs 3D Skeneris</title>
    <style>
        canvas { border: 1px solid black; }
        #threeContainer { width: 100%; height: 400px; border: 1px solid #ccc; }
        #log { margin-top: 10px; font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 10px; border: 1px solid #ccc; }
        .controls { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .section { margin: 10px 0; padding: 10px; border: 1px solid #eee; background: white; }
        button { padding: 8px 15px; margin: 2px; cursor: pointer; }
        input[type="range"] { width: 150px; }
        .capture-area { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .point-info { background: #eef; padding: 5px; margin: 5px 0; }
    </style>
</head>
<body>
    <h1>Vienkāršs 3D Skeneris</h1>
    
    <div class="section">
        <div class="capture-area">
            <video id="video1" autoplay width="160" height="120"></video>
            <canvas id="canvasOnnx" width="160" height="120"></canvas>
            <canvas id="canvas1" width="0" height="0"></canvas>
            <canvas id="canvas2" width="0" height="0"></canvas>
        </div>
        
        <div class="controls">
            <button id="captureXY1">Uzņemt XY (0°)</button>
            <button id="captureZY1">Uzņemt ZY (90°)</button>
            <button id="generateCloud1">Ģenerēt 1. mākoni</button>
        </div>

        <div class="controls">
            <button id="captureXY2">Uzņemt XY (45°)</button>
            <button id="captureZY2">Uzņemt ZY (135°)</button>
            <button id="generateCloud2">Ģenerēt 2. mākoni</button>
        </div>

        <div class="controls">
            <button id="combineClouds">Apvienot mākoņus</button>
            <button id="resetButton">Sākt no jauna</button>
            <button id="downloadButton">Lejupielādēt</button>
        </div>
    </div>

    <div class="section">
        <div class="point-info">
            <div>1. mākonis: <span id="pointCount1">0</span> punkti</div>
            <div>2. mākonis: <span id="pointCount2">0</span> punkti</div>
            <div>Kopā: <span id="totalPoints">0</span> punkti</div>
        </div>
        
        <div class="controls">
            <label for="pointSizeSlider">Punktu lielums: </label>
            <input type="range" id="pointSizeSlider" min="1" max="10" value="3">
            <span id="pointSizeValue">3</span>
        </div>

        <div class="controls">
            <label for="rotationSpeedSlider">Rotācijas ātrums: </label>
            <input type="range" id="rotationSpeedSlider" min="0" max="0.02" value="0.005" step="0.001">
            <span id="rotationSpeedValue">0.005</span>
        </div>
    </div>

    <div id="log">Info: Sagatavojieties uzņemt attēlus...</div>
    
    <div id="threeContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.min.js" defer></script>
    
    <script>
        // Get references to DOM elements
        const video1 = document.getElementById('video1');
        const downloadButton = document.getElementById('downloadButton');
        const pointSizeSlider = document.getElementById('pointSizeSlider');
        const pointSizeValue = document.getElementById('pointSizeValue');
        const rotationSpeedSlider = document.getElementById('rotationSpeedSlider');
        const rotationSpeedValue = document.getElementById('rotationSpeedValue');
        const threeContainer = document.getElementById('threeContainer');
        const log = document.getElementById('log');
        const finalCanvas = document.getElementById("canvasOnnx");
        const finalCtx = finalCanvas.getContext("2d");
        const resetButton = document.getElementById('resetButton');
        
        // Capture buttons
        const captureXY1 = document.getElementById('captureXY1');
        const captureZY1 = document.getElementById('captureZY1');
        const generateCloud1 = document.getElementById('generateCloud1');
        const captureXY2 = document.getElementById('captureXY2');
        const captureZY2 = document.getElementById('captureZY2');
        const generateCloud2 = document.getElementById('generateCloud2');
        const combineClouds = document.getElementById('combineClouds');
        
        // Point counters
        const pointCount1 = document.getElementById('pointCount1');
        const pointCount2 = document.getElementById('pointCount2');
        const totalPoints = document.getElementById('totalPoints');
        
        // Hidden canvases
        const canvas1 = document.getElementById('canvas1');
        const ctx1 = canvas1.getContext('2d');
        const canvas2 = document.getElementById('canvas2');
        const ctx2 = canvas2.getContext('2d');
        
        let session;
        let view1Data = { xy: null, zy: null };
        let view2Data = { xy: null, zy: null };
        let pointCloud1 = [];
        let pointCloud2 = [];
        let combinedPointCloud = [];
        let scene, camera, renderer, pointCloud, material;
        let rotationSpeed = 0.005;
        let pointSize = 3;

        // Update slider displays
        pointSizeSlider.addEventListener('input', () => {
            pointSize = parseFloat(pointSizeSlider.value);
            pointSizeValue.textContent = pointSize;
            if (material) {
                material.size = pointSize;
            }
        });

        rotationSpeedSlider.addEventListener('input', () => {
            rotationSpeed = parseFloat(rotationSpeedSlider.value);
            rotationSpeedValue.textContent = rotationSpeed;
        });

        // ONNX model loading
        window.onload = async function() {
            try {
                session = await ort.InferenceSession.create('./u2netp_128.onnx', {
                    executionProviders: ['wasm']
                });
                logMessage("ONNX modelis ielādēts veiksmīgi");
            } catch (error) {
                logMessage("Kļūda ielādējot modeli: " + error.message);
            }
        };

        // Background removal function
        async function bgRemoval() {
            if (!session) {
                console.error("ONNX model is not loaded yet.");
                return;
            }

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 128;
            tempCanvas.height = 128;
            tempCtx.drawImage(video1, 0, 0, 128, 128);

            const imageData = tempCtx.getImageData(0, 0, 128, 128);

            const floatArr = new Float32Array(128 * 128 * 3);
            for (let i = 0, j = 0; i < imageData.data.length; i += 4, j++) {
                floatArr[j] = (imageData.data[i] / 255 - 0.485) / 0.229;
                floatArr[j + 16384] = (imageData.data[i + 1] / 255 - 0.456) / 0.224;
                floatArr[j + 32768] = (imageData.data[i + 2] / 255 - 0.406) / 0.225;
            }

            const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, 128, 128]);
            const feeds = { "input.1": inputTensor };

            const results = await session.run(feeds);
            const pred = Object.values(results)[0];

            const intermediateCanvas = document.createElement('canvas');
            const intermediateCtx = intermediateCanvas.getContext('2d');
            intermediateCanvas.width = 128;
            intermediateCanvas.height = 128;
            const myImageData = intermediateCtx.createImageData(128, 128);
            const minVal = Math.min(...pred.data);
            const maxVal = Math.max(...pred.data);
            const threshold = (maxVal - minVal) * 0.5 + minVal;

            for (let i = 0; i < pred.data.length; i++) {
                const value = pred.data[i];
                const color = value < threshold ? 255 : 0;
                myImageData.data[i * 4] = color;
                myImageData.data[i * 4 + 1] = color;
                myImageData.data[i * 4 + 2] = color;
                myImageData.data[i * 4 + 3] = 255;
            }

            intermediateCtx.putImageData(myImageData, 0, 0);

            // Scale to display size
            finalCanvas.width = 160;
            finalCanvas.height = 120;
            finalCtx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);
            finalCtx.drawImage(intermediateCanvas, 0, 0, 128, 128, 0, 0, 160, 120);
            
            return intermediateCanvas;
        }

        function logMessage(message) {
            log.textContent = `${message}`;
            console.log(message);
        }

        async function startVideoStream() {
            const constraints = {
                video: { 
                    width: { ideal: 160 },
                    height: { ideal: 120 }
                }
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video1.srcObject = stream;
                processFrame();
            } catch (err) {
                logMessage('Kļūda piekļūstot kamerai: ' + err.message);
            }
        }

        function processFrame() {
            requestAnimationFrame(processFrame);
            ctx1.drawImage(video1, 0, 0, 128, 128);
            ctx2.drawImage(video1, 0, 0, 128, 128);
        }

        // Capture functions
        captureXY1.addEventListener('click', async () => {
            await captureImage('xy', 0, view1Data);
            logMessage("Uzņemts XY attēls (0°) priekš 1. mākoņa");
        });

        captureZY1.addEventListener('click', async () => {
            await captureImage('zy', 90, view1Data);
            logMessage("Uzņemts ZY attēls (90°) priekš 1. mākoņa");
        });

        captureXY2.addEventListener('click', async () => {
            await captureImage('xy', 45, view2Data);
            logMessage("Uzņemts XY attēls (45°) priekš 2. mākoņa");
        });

        captureZY2.addEventListener('click', async () => {
            await captureImage('zy', 135, view2Data);
            logMessage("Uzņemts ZY attēls (135°) priekš 2. mākoņa");
        });

        async function captureImage(type, angle, dataStore) {
            // Capture current frame
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = 128;
            tempCanvas.height = 128;
            tempCtx.drawImage(video1, 0, 0, 128, 128);
            
            // Apply background removal
            await bgRemoval();
            
            // Store the captured data
            dataStore[type] = {
                angle: angle,
                colorData: tempCtx.getImageData(0, 0, 128, 128),
                maskData: finalCtx.getImageData(0, 0, 160, 120)
            };
        }

        // Generate simplified point clouds
        generateCloud1.addEventListener('click', () => {
            if (!view1Data.xy || !view1Data.zy) {
                logMessage("Vispirms uzņemiet abus attēlus pirmajam mākonim");
                return;
            }
            pointCloud1 = generateSimplePointCloud(view1Data);
            pointCount1.textContent = pointCloud1.length;
            logMessage(`1. mākonis izveidots: ${pointCloud1.length} punkti`);
            visualizePointCloud(pointCloud1, "1. mākonis (90°)");
        });

        generateCloud2.addEventListener('click', () => {
            if (!view2Data.xy || !view2Data.zy) {
                logMessage("Vispirms uzņemiet abus attēlus otrajam mākonim");
                return;
            }
            pointCloud2 = generateSimplePointCloud(view2Data);
            pointCount2.textContent = pointCloud2.length;
            logMessage(`2. mākonis izveidots: ${pointCloud2.length} punkti`);
            visualizePointCloud(pointCloud2, "2. mākonis (45°)");
        });

        // Simplified point cloud generation
        function generateSimplePointCloud(viewData) {
            const points = [];
            const xyData = viewData.xy;
            const zyData = viewData.zy;
            const angle = viewData.xy.angle * Math.PI / 180;

            // Use smaller resolution for simpler point cloud
            const resolution = 32; // 32x32 instead of 128x128

            // Process mask to find object points
            const maskPoints = [];
            for (let y = 0; y < resolution; y++) {
                for (let x = 0; x < resolution; x++) {
                    const scaleX = Math.floor(x * (128 / resolution));
                    const scaleY = Math.floor(y * (128 / resolution));
                    const pixelIndex = (scaleY * 128 + scaleX) * 4;
                    
                    // Check if pixel is part of object (black in mask)
                    if (xyData.colorData.data[pixelIndex] < 128) {
                        maskPoints.push({ x: scaleX, y: scaleY });
                    }
                }
            }

            // Create 3D points from mask points with rotation
            maskPoints.forEach(maskPoint => {
                const radius = (maskPoint.x - 64) / 20; // Smaller scale
                const x3d = radius * Math.cos(angle);
                const z3d = radius * Math.sin(angle);
                const y3d = (64 - maskPoint.y) / 20; // Flip Y

                // Get color from original image
                const pixelIndex = (maskPoint.y * 128 + maskPoint.x) * 4;
                const r = xyData.colorData.data[pixelIndex];
                const g = xyData.colorData.data[pixelIndex + 1];
                const b = xyData.colorData.data[pixelIndex + 2];

                points.push({
                    x: x3d,
                    y: y3d,
                    z: z3d,
                    color: { r, g, b }
                });
            });

            // Limit points to reasonable amount
            const maxPoints = 500;
            if (points.length > maxPoints) {
                // Simple downsampling
                return points.filter((_, index) => index % Math.ceil(points.length / maxPoints) === 0);
            }

            return points;
        }

        // Combine point clouds
        combineClouds.addEventListener('click', () => {
            if (pointCloud1.length === 0 && pointCloud2.length === 0) {
                logMessage("Vispirms izveidojiet vismaz vienu punktu mākoni");
                return;
            }
            
            combinedPointCloud = [...pointCloud1, ...pointCloud2];
            totalPoints.textContent = combinedPointCloud.length;
            logMessage(`Mākoņi apvienoti: ${combinedPointCloud.length} punkti`);
            visualizePointCloud(combinedPointCloud, "Apvienotais mākonis");
        });

        // Reset everything
        resetButton.addEventListener('click', () => {
            view1Data = { xy: null, zy: null };
            view2Data = { xy: null, zy: null };
            pointCloud1 = [];
            pointCloud2 = [];
            combinedPointCloud = [];
            pointCount1.textContent = '0';
            pointCount2.textContent = '0';
            totalPoints.textContent = '0';
            if (threeContainer) {
                threeContainer.innerHTML = '';
            }
            logMessage("Visi dati notīrīti. Sāciet no jauna.");
        });

        // Download point cloud
        downloadButton.addEventListener('click', () => {
            const pointsToUse = combinedPointCloud.length > 0 ? combinedPointCloud : 
                              pointCloud1.length > 0 ? pointCloud1 : 
                              pointCloud2.length > 0 ? pointCloud2 : [];
            
            if (pointsToUse.length === 0) {
                logMessage("Nav punktu, ko lejupielādēt");
                return;
            }

            downloadPointCloud(pointsToUse);
        });

        function downloadPointCloud(points) {
            let plyData = `ply\n`;
            plyData += `format ascii 1.0\n`;
            plyData += `element vertex ${points.length}\n`;
            plyData += `property float x\n`;
            plyData += `property float y\n`;
            plyData += `property float z\n`;
            plyData += `property uchar red\n`;
            plyData += `property uchar green\n`;
            plyData += `property uchar blue\n`;
            plyData += `end_header\n`;

            points.forEach(point => {
                const { x, y, z, color } = point;
                plyData += `${x.toFixed(3)} ${y.toFixed(3)} ${z.toFixed(3)} ${color.r} ${color.g} ${color.b}\n`;
            });

            const blob = new Blob([plyData], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'vienkars_3d_modelis.ply';
            link.click();

            logMessage(`Lejupielādēts fails ar ${points.length} punktiem`);
        }

        // Visualization
        function visualizePointCloud(points, title = "3D Modelis") {
            threeContainer.innerHTML = '';
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            camera = new THREE.PerspectiveCamera(60, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 100);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
            threeContainer.appendChild(renderer.domElement);

            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];

            points.forEach(point => {
                vertices.push(point.x, point.y, point.z);
                colors.push(point.color.r / 255, point.color.g / 255, point.color.b / 255);
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

            material = new THREE.PointsMaterial({ 
                vertexColors: true, 
                size: pointSize,
                sizeAttenuation: false
            });
            
            pointCloud = new THREE.Points(geometry, material);
            scene.add(pointCloud);

            // Add coordinate axes for reference
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);

            // Add grid for reference
            const gridHelper = new THREE.GridHelper(10, 10);
            scene.add(gridHelper);

            camera.position.set(8, 8, 8);
            camera.lookAt(0, 0, 0);

            function animate() {
                requestAnimationFrame(animate);
                pointCloud.rotation.y += rotationSpeed;
                renderer.render(scene, camera);
            }

            animate();

            logMessage(`${title} - ${points.length} punkti. Rotē ap Y asi.`);
        }

        // Start video stream
        startVideoStream();
    </script>
</body>
</html>
