<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Skeneris ar XZ template</title>
    <style>
        canvas { border: 1px solid black; }
        #threeContainer { width: 100%; height: 500px; border: 1px solid #ccc; }
        #log { margin-top: 10px; font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 10px; border: 1px solid #ccc; }
        .controls { display: flex; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
        .section { margin: 10px 0; padding: 10px; border: 1px solid #eee; background: white; }
        button { padding: 8px 15px; margin: 2px; cursor: pointer; }
        .capture-area { display: flex; gap: 10px; align-items: center; margin: 10px 0; }
        .point-info { background: #eef; padding: 5px; margin: 5px 0; }
        .view-group { background: #f5f5f5; padding: 10px; margin: 5px 0; border-radius: 5px; }
        .rotation-controls { background: #e6f7ff; padding: 10px; margin: 5px 0; border-radius: 5px; }
        .rotation-buttons { display: flex; gap: 5px; flex-wrap: wrap; }
        .rotation-axis { background: #fff3cd; padding: 5px; margin: 2px; border-radius: 3px; }
    </style>
</head>
<body>
    <h1>3D Skeneris ar XZ template</h1>
    
    <div class="section">
        <div class="capture-area">
            <video id="video1" autoplay width="128" height="128"></video>
            <canvas id="canvasZY" width="128" height="128"></canvas>
            <canvas id="canvasOnnx" width="128" height="128"></canvas>
            <canvas id="canvas1" width="0" height="0"></canvas>
            <canvas id="canvas2" width="0" height="0"></canvas>
        </div>
    </div>

    <div class="section">
        <div class="view-group">
            <h3>Galvenais punktu mākonis</h3>
            <div class="controls">
                <button id="xyButton">XY attēls</button>
                <button id="zyButton">ZY attēls</button>
                <button id="generateMainCloud">Ģenerēt galveno mākoni</button>
            </div>
            <div class="point-info">Galvenais mākonis: <span id="pointCount1">0</span> punkti</div>
        </div>

        <div class="view-group">
            <h3>XZ Template (no augšas)</h3>
            <div class="controls">
                <button id="xzButton">XZ attēls</button>
                <button id="generateTemplate">Ģenerēt template</button>
            </div>
            <div class="point-info">Template mākonis: <span id="pointCount2">0</span> punkti</div>
        </div>

        <div class="controls">
            <button id="applyFilter">Lietot filtru</button>
            <button id="resetButton">Sākt no jauna</button>
            <button id="downloadButton">Lejupielādēt</button>
        </div>
        
        <div class="point-info">
            <strong>Filtrētie punkti: <span id="filteredPoints">0</span> / <span id="totalPoints">0</span></strong>
        </div>
    </div>

    <div class="section">
        <div class="rotation-controls">
            <h3>XZ Template rotācija</h3>
            <div class="rotation-buttons">
                <div class="rotation-axis">
                    <strong>X ass:</strong>
                    <button data-axis="x" data-angle="0">0°</button>
                    <button data-axis="x" data-angle="90">90°</button>
                    <button data-axis="x" data-angle="180">180°</button>
                    <button data-axis="x" data-angle="270">270°</button>
                </div>
                <div class="rotation-axis">
                    <strong>Y ass:</strong>
                    <button data-axis="y" data-angle="0">0°</button>
                    <button data-axis="y" data-angle="90">90°</button>
                    <button data-axis="y" data-angle="180">180°</button>
                    <button data-axis="y" data-angle="270">270°</button>
                </div>
                <div class="rotation-axis">
                    <strong>Z ass:</strong>
                    <button data-axis="z" data-angle="0">0°</button>
                    <button data-axis="z" data-angle="90">90°</button>
                    <button data-axis="z" data-angle="180">180°</button>
                    <button data-axis="z" data-angle="270">270°</button>
                </div>
            </div>
            <div class="controls">
                <button id="autoApplyToggle">Automātiskais filtrs</button>
                <button id="resetRotation">Atiestatīt rotāciju</button>
            </div>
        </div>

        <div class="controls">
            <label for="pointSizeSlider">Punktu lielums: </label>
            <input type="range" id="pointSizeSlider" min="0.5" max="10" value="3">
            <span id="pointSizeValue">3</span>
        </div>
    </div>

    <div id="log">Info: Sagatavojieties uzņemt attēlus...</div>
    
    <div id="threeContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.min.js" defer></script>
    
    <script>
        // Get references to DOM elements
        const video1 = document.getElementById('video1');
        const canvas1 = document.getElementById('canvas1');
        const ctx1 = canvas1.getContext('2d');
        const downloadButton = document.getElementById('downloadButton');
        const pointSizeSlider = document.getElementById('pointSizeSlider');
        const pointSizeValue = document.getElementById('pointSizeValue');
        const threeContainer = document.getElementById('threeContainer');
        const log = document.getElementById('log');
        const finalCanvas = document.getElementById("canvasOnnx");
        const finalCtx = finalCanvas.getContext("2d");
        const resetButton = document.getElementById('resetButton');
        
        // Main cloud buttons
        const xyButton = document.getElementById('xyButton');
        const zyButton = document.getElementById('zyButton');
        const generateMainCloud = document.getElementById('generateMainCloud');
        
        // Template buttons
        const xzButton = document.getElementById('xzButton');
        const generateTemplate = document.getElementById('generateTemplate');
        const applyFilter = document.getElementById('applyFilter');
        
        // Point counters
        const pointCount1 = document.getElementById('pointCount1');
        const pointCount2 = document.getElementById('pointCount2');
        const totalPoints = document.getElementById('totalPoints');
        const filteredPoints = document.getElementById('filteredPoints');
        
        // Rotation controls
        const rotationButtons = document.querySelectorAll('[data-axis]');
        const autoApplyToggle = document.getElementById('autoApplyToggle');
        const resetRotation = document.getElementById('resetRotation');
        
        const canvas2 = document.getElementById('canvasZY');
        const ctx2 = canvas2.getContext('2d');
        const canvasZY = document.getElementById('canvasZY');
        const ctxZY = canvasZY.getContext('2d');
        
        let session;
        let mainCloudData = { pointsXY: [], pointsZY: [], savedXYData: null, savedZYData: null };
        let templateData = { pointsXZ: [], savedXZData: null };
        let originalPointCloud = [];
        let templatePointCloud = [];
        let filteredPointCloud = [];
        let scene, camera, renderer, controls;
        let mainCloudObject, templateCloudObject, filteredCloudObject;
        let mainMaterial, templateMaterial, filteredMaterial;
        
        // Filter settings
        let filterSettings = {
            axisRotations: { x: 0, y: 0, z: 0 },
            autoApply: true
        };

        // Update slider displays
        pointSizeSlider.addEventListener('input', () => {
            pointSizeValue.textContent = pointSizeSlider.value;
            if (mainMaterial) mainMaterial.size = parseFloat(pointSizeSlider.value);
            if (templateMaterial) templateMaterial.size = parseFloat(pointSizeSlider.value) * 1.5;
            if (filteredMaterial) filteredMaterial.size = parseFloat(pointSizeSlider.value);
        });

        // Rotation buttons event listeners
        rotationButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                const axis = e.target.dataset.axis;
                const angle = parseInt(e.target.dataset.angle);
                filterSettings.axisRotations[axis] = angle;
                
                // Update button styles
                document.querySelectorAll(`[data-axis="${axis}"]`).forEach(btn => {
                    btn.style.background = '';
                    btn.style.color = '';
                });
                e.target.style.background = '#4CAF50';
                e.target.style.color = 'white';
                
                if (filterSettings.autoApply) {
                    applyTemplateFilter();
                }
            });
        });

        autoApplyToggle.addEventListener('click', () => {
            filterSettings.autoApply = !filterSettings.autoApply;
            autoApplyToggle.textContent = filterSettings.autoApply ? 
                'Automātiskais filtrs: IESLĒGTS' : 'Automātiskais filtrs: IZSLĒGTS';
            autoApplyToggle.style.background = filterSettings.autoApply ? '#4CAF50' : '#f44336';
        });

        resetRotation.addEventListener('click', () => {
            filterSettings.axisRotations = { x: 0, y: 0, z: 0 };
            
            // Reset rotation buttons
            rotationButtons.forEach(button => {
                button.style.background = '';
                button.style.color = '';
            });
            
            if (filterSettings.autoApply) {
                applyTemplateFilter();
            }
        });

        // ONNX model loading
        window.onload = async function() {
            try {
                session = await ort.InferenceSession.create('./u2netp_128.onnx', {
                    executionProviders: ['wasm']
                });
                console.log("Model loaded successfully");
                logMessage("ONNX modelis ielādēts veiksmīgi");
            } catch (error) {
                console.error("Error loading model:", error);
                logMessage("Kļūda ielādējot modeli: " + error.message);
            }
        };

        // Background removal function
        async function bgRemoval() {
            if (!session) {
                console.error("ONNX model is not loaded yet.");
                return;
            }

            const canvas = document.getElementById("canvasZY");
            const ctx = canvas.getContext("2d");
            const imageData = ctx.getImageData(0, 0, 128, 128);

            const offscreenCanvas = document.createElement('canvas');
            const offscreenCtx = offscreenCanvas.getContext('2d');
            offscreenCanvas.width = 128;
            offscreenCanvas.height = 128;
            offscreenCtx.putImageData(imageData, 0, 0);
            
            const resizedCanvas = document.createElement('canvas');
            const resizedCtx = resizedCanvas.getContext('2d');
            resizedCanvas.width = 128;
            resizedCanvas.height = 128;
            resizedCtx.drawImage(offscreenCanvas, 0, 0, 128, 128, 0, 0, 128, 128);

            const resizedImageData = resizedCtx.getImageData(0, 0, 128, 128).data;

            const floatArr = new Float32Array(128 * 128 * 3);
            for (let i = 0, j = 0; i < resizedImageData.length; i += 4, j++) {
                floatArr[j] = (resizedImageData[i] / 255 - 0.485) / 0.229;
                floatArr[j + 16384] = (resizedImageData[i + 1] / 255 - 0.456) / 0.224;
                floatArr[j + 32768] = (resizedImageData[i + 2] / 255 - 0.406) / 0.225;
            }

            const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, 128, 128]);
            const feeds = { "input.1": inputTensor };

            const results = await session.run(feeds);
            const pred = Object.values(results)[0];

            const intermediateCanvas = document.createElement('canvas');
            const intermediateCtx = intermediateCanvas.getContext('2d');
            intermediateCanvas.width = 128;
            intermediateCanvas.height = 128;
            const myImageData = intermediateCtx.createImageData(128, 128);
            const minVal = Math.min(...pred.data);
            const maxVal = Math.max(...pred.data);
            const threshold = (maxVal - minVal) * 0.5 + minVal;

            for (let i = 0; i < pred.data.length; i++) {
                const value = pred.data[i];
                const color = value < threshold ? 255 : 0;
                myImageData.data[i * 4] = color;
                myImageData.data[i * 4 + 1] = color;
                myImageData.data[i * 4 + 2] = color;
                myImageData.data[i * 4 + 3] = 255;
            }

            intermediateCtx.putImageData(myImageData, 0, 0);

            finalCanvas.width = 128;
            finalCanvas.height = 128;
            finalCtx.clearRect(0, 0, finalCanvas.width, finalCanvas.height);
            finalCtx.drawImage(intermediateCanvas, 0, 0, 128, 128, 0, 0, finalCanvas.width, finalCanvas.height);
        }

        function isMobile() {
            return /Mobi|Android|iPhone|iPad|iPod|BlackBerry|Windows Phone/i.test(navigator.userAgent);
        }

        function logMessage(message) {
            log.textContent = `${message}`;
            log.scrollTop = log.scrollHeight;
        }

        async function startVideoStream() {
            const constraints = {
                video: isMobile() ? { facingMode: { exact: "environment" } } : true
            };
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video1.srcObject = stream;
                processFrame();
            } catch (err) {
                console.error('Error accessing the camera: ', err);
                logMessage('Kļūda piekļūstot kamerai: ' + err.message);
            }
        }

        function processFrame() {
            requestAnimationFrame(processFrame);
            ctx1.drawImage(video1, 0, 0, 128, 128);
            ctx2.drawImage(video1, 0, 0, 128, 128);
            ctxZY.drawImage(video1, 0, 0, 128, 128);
        }

        // Process functions
        xyButton.addEventListener('click', async () => {
            await bgRemoval();
            mainCloudData.savedXYData = ctx2.getImageData(0, 0, 128, 128);
            processXY();
            logMessage("Galvenais mākonis: XY attēls procesēts");
        });

        zyButton.addEventListener('click', async () => {
            await bgRemoval();
            mainCloudData.savedZYData = ctx2.getImageData(0, 0, 128, 128);
            processZY();
            logMessage("Galvenais mākonis: ZY attēls procesēts");
        });

        xzButton.addEventListener('click', async () => {
            await bgRemoval();
            templateData.savedXZData = ctx2.getImageData(0, 0, 128, 128);
            processXZ();
            logMessage("XZ Template: XZ attēls procesēts");
        });

        function processXY() {
            const imgData = finalCtx.getImageData(0, 0, 128, 128);
            mainCloudData.pointsXY = new Array(128).fill().map(() => new Array(128).fill(false));

            for (let y = 0; y < 128; y++) {
                for (let x = 0; x < 128; x++) {
                    const pixelIndex = (y * 128 + x) * 4;
                    if (imgData.data[pixelIndex] === 0) {
                        for (let z = 0; z < 128; z++) {
                            mainCloudData.pointsXY[x][y] = true;
                        }
                    }
                }
            }
        }

        function processZY() {
            const imgData = finalCtx.getImageData(0, 0, 128, 128);
            mainCloudData.pointsZY = new Array(128).fill().map(() => new Array(128).fill(false));

            for (let y = 0; y < 128; y++) {
                for (let z = 0; z < 128; z++) {
                    const pixelIndex = (y * 128 + z) * 4;
                    if (imgData.data[pixelIndex] === 0) {
                        for (let x = 0; x < 128; x++) {
                            mainCloudData.pointsZY[z][y] = true;
                        }
                    }
                }
            }
        }

        function processXZ() {
            const imgData = finalCtx.getImageData(0, 0, 128, 128);
            templateData.pointsXZ = new Array(128).fill().map(() => new Array(128).fill(false));

            // XZ plakne - no augšas skats
            for (let z = 0; z < 128; z++) {
                for (let x = 0; x < 128; x++) {
                    const pixelIndex = (64 * 128 + x) * 4; // Centra līnija Y=64
                    if (imgData.data[pixelIndex] === 0) {
                        for (let y = 0; y < 128; y++) {
                            templateData.pointsXZ[x][z] = true;
                        }
                    }
                }
            }
        }

        // Generate main point cloud from XY and ZY
        generateMainCloud.addEventListener('click', () => {
            originalPointCloud = findCommonPoints(mainCloudData);
            pointCount1.textContent = originalPointCloud.length;
            totalPoints.textContent = originalPointCloud.length;
            filteredPoints.textContent = originalPointCloud.length;
            filteredPointCloud = [...originalPointCloud];
            logMessage(`Galvenais mākonis izveidots: ${originalPointCloud.length} punkti`);
            visualizePointClouds();
        });

        // Generate template from XZ
        generateTemplate.addEventListener('click', () => {
            templatePointCloud = createXZTemplate(templateData);
            pointCount2.textContent = templatePointCloud.length;
            logMessage(`XZ Template izveidots: ${templatePointCloud.length} punkti`);
            visualizePointClouds();
        });

        applyFilter.addEventListener('click', () => {
            applyTemplateFilter();
        });

        // Create XZ template (2D from top view)
        function createXZTemplate(templateData) {
            const points = [];
            const colorData = templateData.savedXZData;

            if (!colorData) {
                return points;
            }

            const step = 4;
            
            for (let x = 0; x < 128; x += step) {
                for (let z = 0; z < 128; z += step) {
                    if (templateData.pointsXZ[x][z]) {
                        const pixelIndex = (64 * 128 + x) * 4; // Centra Y pozīcija
                        
                        const r = colorData.data[pixelIndex];
                        const g = colorData.data[pixelIndex + 1];
                        const b = colorData.data[pixelIndex + 2];

                        // XZ plakne - Y ir 0 (centrā)
                        points.push({ 
                            x: x - 64, 
                            y: 0, 
                            z: z - 64, 
                            color: { r, g, b } 
                        });
                    }
                }
            }

            return points;
        }

        // Template filter function with axis rotations
        function applyTemplateFilter() {
            if (originalPointCloud.length === 0 || templatePointCloud.length === 0) {
                logMessage("Vispirms izveidojiet galveno mākoni un XZ template");
                return;
            }

            filteredPointCloud = [];
            
            // Convert degrees to radians
            const xRotationRad = filterSettings.axisRotations.x * Math.PI / 180;
            const yRotationRad = filterSettings.axisRotations.y * Math.PI / 180;
            const zRotationRad = filterSettings.axisRotations.z * Math.PI / 180;
            
            // Create transformed template points with all rotations
            const transformedTemplate = templatePointCloud.map(point => {
                let x = point.x;
                let y = point.y;
                let z = point.z;
                
                // Apply X axis rotation
                if (xRotationRad !== 0) {
                    const cosX = Math.cos(xRotationRad);
                    const sinX = Math.sin(xRotationRad);
                    const newY = y * cosX - z * sinX;
                    const newZ = y * sinX + z * cosX;
                    y = newY;
                    z = newZ;
                }
                
                // Apply Y axis rotation
                if (yRotationRad !== 0) {
                    const cosY = Math.cos(yRotationRad);
                    const sinY = Math.sin(yRotationRad);
                    const newX = x * cosY + z * sinY;
                    const newZ = -x * sinY + z * cosY;
                    x = newX;
                    z = newZ;
                }
                
                // Apply Z axis rotation
                if (zRotationRad !== 0) {
                    const cosZ = Math.cos(zRotationRad);
                    const sinZ = Math.sin(zRotationRad);
                    const newX = x * cosZ - y * sinZ;
                    const newY = x * sinZ + y * cosZ;
                    x = newX;
                    y = newY;
                }
                
                return { x, y, z };
            });

            // Filter main cloud based on template - keep points that DON'T match template
            originalPointCloud.forEach(point => {
                let matchFound = false;
                
                // Check if point matches any template point
                for (const templatePoint of transformedTemplate) {
                    const distance = Math.sqrt(
                        Math.pow(point.x - templatePoint.x, 2) +
                        Math.pow(point.z - templatePoint.z, 2) +
                        Math.pow(point.y - templatePoint.y, 2)
                    );
                    
                    // If point is close to template point, remove it
                    if (distance <= 8) { // Fixed threshold for simplicity
                        matchFound = true;
                        break;
                    }
                }
                
                // Keep points that don't match template (inverse filter)
                if (!matchFound) {
                    filteredPointCloud.push(point);
                }
            });

            filteredPoints.textContent = filteredPointCloud.length;
            
            // Calculate removed points
            const removedPoints = originalPointCloud.length - filteredPointCloud.length;
            const removedPercentage = ((removedPoints / originalPointCloud.length) * 100).toFixed(1);
            
            logMessage(`Filtrēti ${filteredPointCloud.length} punkti (noņemti ${removedPoints} punkti, ${removedPercentage}%)`);
            updateVisualization();
        }

        function findCommonPoints(mainData) {
            const commonPoints = [];
            const colorDataXY = mainData.savedXYData;
            const colorDataZY = mainData.savedZYData;
            const pointsXY = mainData.pointsXY;
            const pointsZY = mainData.pointsZY;

            if (!colorDataXY || !colorDataZY) {
                return commonPoints;
            }

            let sumX = 0, sumY = 0, sumZ = 0, count = 0;
            const step = 4;
            
            for (let x = 0; x < 128; x += step) {
                for (let y = 0; y < 128; y += step) {
                    for (let z = 0; z < 128; z += step) {
                        if (pointsXY[x][y] && pointsZY[z][y]) {
                            const pixelIndexXY = (y * 128 + x) * 4;
                            const pixelIndexZY = (y * 128 + z) * 4;

                            const rZY = colorDataXY.data[pixelIndexXY];
                            const gZY = colorDataXY.data[pixelIndexXY + 1];
                            const bZY = colorDataXY.data[pixelIndexXY + 2];

                            const rXY = colorDataZY.data[pixelIndexZY];
                            const gXY = colorDataZY.data[pixelIndexZY + 1];
                            const bXY = colorDataZY.data[pixelIndexZY + 2];

                            const r = Math.floor((rXY + rZY) / 2);
                            const g = Math.floor((gXY + gZY) / 2);
                            const b = Math.floor((bXY + bZY) / 2);

                            commonPoints.push({ x, y, z, color: { r, g, b } });

                            sumX += x;
                            sumY += y;
                            sumZ += z;
                            count++;
                        }
                    }
                }
            }

            if (count > 0) {
                const avgX = sumX / count;
                const avgY = sumY / count;
                const avgZ = sumZ / count;

                for (let i = 0; i < commonPoints.length; i++) {
                    commonPoints[i].x -= avgX;
                    commonPoints[i].y -= avgY;
                    commonPoints[i].z -= avgZ;
                }
            }

            return commonPoints;
        }

        // Reset everything
        resetButton.addEventListener('click', () => {
            mainCloudData = { pointsXY: [], pointsZY: [], savedXYData: null, savedZYData: null };
            templateData = { pointsXZ: [], savedXZData: null };
            originalPointCloud = [];
            templatePointCloud = [];
            filteredPointCloud = [];
            pointCount1.textContent = '0';
            pointCount2.textContent = '0';
            totalPoints.textContent = '0';
            filteredPoints.textContent = '0';
            threeContainer.innerHTML = '';
            resetRotation.click();
            logMessage("Visi dati notīrīti. Sāciet no jauna.");
        });

        // Download filtered point cloud
        downloadButton.addEventListener('click', () => {
            const pointsToUse = filteredPointCloud.length > 0 ? filteredPointCloud : originalPointCloud;
            
            if (pointsToUse.length === 0) {
                logMessage("Nav punktu, ko lejupielādēt.");
                return;
            }

            downloadPointCloud(pointsToUse);
        });

        function downloadPointCloud(points) {
            let plyData = `ply\n`;
            plyData += `format ascii 1.0\n`;
            plyData += `element vertex ${points.length}\n`;
            plyData += `property float x\n`;
            plyData += `property float y\n`;
            plyData += `property float z\n`;
            plyData += `property uchar red\n`;
            plyData += `property uchar green\n`;
            plyData += `property uchar blue\n`;
            plyData += `end_header\n`;

            points.forEach(point => {
                const { x, y, z, color } = point;
                plyData += `${x} ${-y} ${z} ${color.r} ${color.g} ${color.b}\n`;
            });

            const blob = new Blob([plyData], { type: 'text/plain' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'filtrēts_3d_modelis.ply';
            link.click();

            logMessage(`Lejupielādēts fails ar ${points.length} punktiem`);
        }

        function visualizePointClouds() {
            threeContainer.innerHTML = '';
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            camera = new THREE.PerspectiveCamera(75, threeContainer.clientWidth / threeContainer.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(threeContainer.clientWidth, threeContainer.clientHeight);
            threeContainer.appendChild(renderer.domElement);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 10;
            controls.maxDistance = 500;

            // Main point cloud (semi-transparent)
            if (originalPointCloud.length > 0) {
                const geometry1 = createGeometryFromPoints(originalPointCloud);
                mainMaterial = new THREE.PointsMaterial({ 
                    vertexColors: true, 
                    size: parseFloat(pointSizeSlider.value),
                    sizeAttenuation: false,
                    opacity: 0.3,
                    transparent: true
                });
                mainCloudObject = new THREE.Points(geometry1, mainMaterial);
                scene.add(mainCloudObject);
            }

            // Template point cloud (wireframe style)
            if (templatePointCloud.length > 0) {
                const geometry2 = createGeometryFromPoints(templatePointCloud);
                templateMaterial = new THREE.PointsMaterial({ 
                    color: 0xff0000,
                    size: parseFloat(pointSizeSlider.value) * 1.5,
                    sizeAttenuation: false
                });
                templateCloudObject = new THREE.Points(geometry2, templateMaterial);
                scene.add(templateCloudObject);
            }

            // Filtered point cloud (solid)
            if (filteredPointCloud.length > 0) {
                const geometry3 = createGeometryFromPoints(filteredPointCloud);
                filteredMaterial = new THREE.PointsMaterial({ 
                    vertexColors: true, 
                    size: parseFloat(pointSizeSlider.value),
                    sizeAttenuation: false
                });
                filteredCloudObject = new THREE.Points(geometry3, filteredMaterial);
                scene.add(filteredCloudObject);
            }

            // Add coordinate axes
            const axesHelper = new THREE.AxesHelper(50);
            scene.add(axesHelper);

            camera.position.set(100, 100, 200);
            camera.lookAt(0, 0, 0);
            controls.update();

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            logMessage(`Vizualizācija: Galvenais (pelēks), XZ Template (sarkans), Filtrētais (krāsains)`);
        }

        function updateVisualization() {
            if (!scene) return;

            // Update filtered cloud
            if (filteredCloudObject) {
                scene.remove(filteredCloudObject);
            }

            if (filteredPointCloud.length > 0) {
                const geometry3 = createGeometryFromPoints(filteredPointCloud);
                filteredMaterial = new THREE.PointsMaterial({ 
                    vertexColors: true, 
                    size: parseFloat(pointSizeSlider.value),
                    sizeAttenuation: false
                });
                filteredCloudObject = new THREE.Points(geometry3, filteredMaterial);
                scene.add(filteredCloudObject);
            }
        }

        function createGeometryFromPoints(points) {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            const colors = [];

            points.forEach(point => {
                const { x, y, z, color } = point;
                vertices.push(x * 2, -y * 2, z * 2);
                colors.push(color.r / 255, color.g / 255, color.b / 255);
            });

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            return geometry;
        }

        // Start video stream
        startVideoStream();
    </script>
</body>
</html>
