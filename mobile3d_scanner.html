<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Scanner with ONNX Background Removal</title>
  <style>
    canvas { border: 1px solid black; }
    #threeContainer { width: 100%; height: 400px; }
    #log { margin-top: 10px; font-family: Arial, sans-serif; background-color: #f0f0f0; padding: 10px; border: 1px solid #ccc; }
    .camera-controls { margin: 10px 0; }
    button { margin: 5px; padding: 8px 15px; }
  </style>
</head>
<body>
  <h2>3D Scanner with Camera Coordinates (ONNX Background Removal)</h2>
  
  <div class="camera-controls">
    <button id="captureXY">Capture XY</button>
    <button id="captureZY">Capture ZY</button>
    <button id="resetScan">Reset Scan</button>
    <span id="frameCount">Frames: 0</span>
  </div>

  <video id="video1" autoplay width="320" height="240"></video>
  <canvas id="canvasProcessed" width="320" height="240"></canvas>
  <canvas id="canvasOnnx" width="320" height="240"></canvas>

  <br>
  <button id="downloadButton">Download & Visualize Point Cloud</button>

  <div id="log">Info: Ready</div>
  <div id="threeContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.130.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@latest/dist/ort.min.js"></script>

  <script>
  const video1 = document.getElementById('video1');
  const canvasProcessed = document.getElementById('canvasProcessed');
  const ctxProcessed = canvasProcessed.getContext('2d');
  const canvasOnnx = document.getElementById('canvasOnnx');
  const ctxOnnx = canvasOnnx.getContext('2d');
  const log = document.getElementById('log');
  const frameCount = document.getElementById('frameCount');

  const captureXY = document.getElementById('captureXY');
  const captureZY = document.getElementById('captureZY');
  const resetScan = document.getElementById('resetScan');
  const downloadButton = document.getElementById('downloadButton');

  let session;
  let savedXY = null;
  let savedZY = null;
  let pointCloud = [];

  function logMessage(msg) {
    log.textContent = msg;
    console.log(msg);
  }

  async function startVideoStream() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
      video1.srcObject = stream;
      drawFrame();
    } catch (e) {
      logMessage("Camera error: " + e);
    }
  }

  function drawFrame() {
    if (video1.videoWidth > 0) {
      ctxProcessed.drawImage(video1, 0, 0, 320, 240);
    }
    requestAnimationFrame(drawFrame);
  }

  window.onload = async function() {
    try {
      session = await ort.InferenceSession.create('./u2netp_128.onnx', { executionProviders: ['wasm'] });
      logMessage("✅ ONNX model loaded");
    } catch (err) {
      logMessage("❌ Failed to load ONNX: " + err.message);
    }
  };

  // ONNX Background removal
  async function bgRemoval(inputCanvas) {
    const ctx = inputCanvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, 320, 240);

    // Resize for model
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = 128;
    tempCanvas.height = 128;
    tempCtx.drawImage(inputCanvas, 0, 0, 320, 240, 0, 0, 128, 128);

    const resized = tempCtx.getImageData(0, 0, 128, 128).data;
    const input = new Float32Array(1 * 3 * 128 * 128);
    for (let i = 0, j = 0; i < resized.length; i += 4, j++) {
      input[j] = (resized[i] / 255 - 0.485) / 0.229;
      input[j + 128 * 128] = (resized[i + 1] / 255 - 0.456) / 0.224;
      input[j + 2 * 128 * 128] = (resized[i + 2] / 255 - 0.406) / 0.225;
    }

    const tensor = new ort.Tensor('float32', input, [1, 3, 128, 128]);
    const result = await session.run({ 'input.1': tensor });
    const output = result[Object.keys(result)[0]].data;

    // Convert output to grayscale mask
    const maskCanvas = document.createElement('canvas');
    maskCanvas.width = 128;
    maskCanvas.height = 128;
    const maskCtx = maskCanvas.getContext('2d');
    const maskImage = maskCtx.createImageData(128, 128);

    const min = Math.min(...output);
    const max = Math.max(...output);
    const threshold = min + (max - min) * 0.5;

    for (let i = 0; i < output.length; i++) {
      const v = output[i];
      const color = v > threshold ? 255 : 0;
      maskImage.data[i * 4] = color;
      maskImage.data[i * 4 + 1] = color;
      maskImage.data[i * 4 + 2] = color;
      maskImage.data[i * 4 + 3] = 255;
    }

    maskCtx.putImageData(maskImage, 0, 0);
    return maskCanvas;
  }

  // Capture XY or ZY
  async function captureFrame(label) {
    try {
      const snapCanvas = document.createElement('canvas');
      snapCanvas.width = 320;
      snapCanvas.height = 240;
      snapCanvas.getContext('2d').drawImage(video1, 0, 0, 320, 240);

      const mask = await bgRemoval(snapCanvas);

      // Draw on preview canvas
      ctxOnnx.clearRect(0, 0, 320, 240);
      ctxOnnx.drawImage(mask, 0, 0, 128, 128, 0, 0, 320, 240);

      if (label === 'XY') savedXY = mask;
      if (label === 'ZY') savedZY = mask;

      frameCount.textContent = `Frames: ${(savedXY ? 1 : 0) + (savedZY ? 1 : 0)}`;
      logMessage(`✅ ${label} captured with background removed`);
    } catch (e) {
      logMessage("Capture failed: " + e.message);
    }
  }

  captureXY.onclick = () => captureFrame('XY');
  captureZY.onclick = () => captureFrame('ZY');

  resetScan.onclick = () => {
    savedXY = savedZY = null;
    frameCount.textContent = "Frames: 0";
    ctxOnnx.clearRect(0, 0, 320, 240);
    logMessage("🔄 Reset complete");
  };

  downloadButton.onclick = () => {
    if (!savedXY || !savedZY) {
      logMessage("Need both XY and ZY before generating 3D cloud");
      return;
    }
    logMessage("3D reconstruction placeholder — add point fusion here.");
  };

  startVideoStream();
  </script>
</body>
</html>
