// 🧹 CLEANUP FUNCTION
async function cleanUpMemory() {
    console.log("🧹 Cleaning up unused data...");
    // Clear visible canvases (small ones)
    [ctx1, finalCtx].forEach(ctx => { if (ctx) ctx.clearRect(0,0,128,128); });

    // Dispose Three.js objects if they exist
    if (renderer) {
        if (scene) {
            scene.traverse(obj => {
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
        }
        try { renderer.dispose(); renderer.forceContextLoss(); } catch(e){/*ignore*/ }
        try { if (renderer.domElement && renderer.domElement.parentNode) renderer.domElement.parentNode.removeChild(renderer.domElement); } catch(e){}
        renderer = null;
    }

    // Clear large data arrays
    pointsXY = [];
    pointsZY = [];
    commonPoints = [];
    savedXYData = null;
    savedZYData = null;

    // Revoke object URLs
    if (window.lastImageURL) { URL.revokeObjectURL(window.lastImageURL); window.lastImageURL = null; }

    // Try releasing ONNX memory (best-effort)
    if (session) {
        try { await session.release?.(); } catch(e) { /*ignore*/ }
    }

    if (window.gc) window.gc();
    logMessage("Atmiņa attīrīta!");
}

// Stop camera safely
function stopVideoStream() {
    const stream = video1.srcObject;
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video1.srcObject = null;
    }
}

// Mobile check
function isMobile() { return /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent); }

// Load ONNX model
window.onload = async function() {
    try {
        logMessage("Ielādē modeli...");
        session = await ort.InferenceSession.create('./u2netp_128.onnx', { executionProviders: ['wasm'] });
        logMessage("Modelis ielādēts! Gatavs.");
    } catch (e) {
        console.error("ONNX load error:", e);
        logMessage("Neizdevās ielādēt ONNX modeli. Skatīt konsoli.");
    }
    startVideoStream();
};

async function startVideoStream() {
    const constraints = { video: isMobile() ? { facingMode: { exact: "environment" } } : true };
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video1.srcObject = stream;
        processFrame();
    } catch (err) {
        console.error('Camera error:', err);
        logMessage('Kamera nav pieejama: ' + err.message);
    }
}

function processFrame() {
    requestAnimationFrame(processFrame);
    // draw into canvas1 (hidden) and canvasZY (visible) for preview
    try {
        ctx1.drawImage(video1, 0, 0, 128, 128);
        ctx2.drawImage(video1, 0, 0, 128, 128);
    } catch(e) { /* might throw while stream not ready */ }
}

// ONNX background removal — reads from canvasZY and writes mask to canvasOnnx
async function bgRemoval() {
    if (!session) { logMessage("Modelis nav gatavs — gaidiet..."); return false; }
    logMessage("Fona noņemšana (ONNX)...");
    try {
        // Read current preview from canvasZY
        const ctxSrc = document.getElementById("canvasZY").getContext("2d");
        const imageData = ctxSrc.getImageData(0, 0, 128, 128);
        const data = imageData.data;

        // Prepare input float array in [1,3,128,128] with normalization
        const floatArr = new Float32Array(128 * 128 * 3);
        for (let i = 0, j = 0; i < data.length; i += 4, j++) {
            floatArr[j] = (data[i] / 255 - 0.485) / 0.229;
            floatArr[j + 16384] = (data[i + 1] / 255 - 0.456) / 0.224;
            floatArr[j + 32768] = (data[i + 2] / 255 - 0.406) / 0.225;
        }

        const inputTensor = new ort.Tensor('float32', floatArr, [1, 3, 128, 128]);
        const results = await session.run({ "input.1": inputTensor });
        const pred = Object.values(results)[0]; // get output tensor
        const out = pred.data;

        // compute threshold and build binary image (white background, black foreground)
        let minVal = Infinity, maxVal = -Infinity;
        for (let i = 0; i < out.length; i++) {
            if (out[i] < minVal) minVal = out[i];
            if (out[i] > maxVal) maxVal = out[i];
        }
        const threshold = (maxVal - minVal) * 0.5 + minVal;

        const outImage = finalCtx.createImageData(128, 128);
        for (let i = 0; i < out.length; i++) {
            const v = out[i];
            const color = v < threshold ? 0 : 255; // 0 = foreground (black), 255 = background (white)
            // We'll make foreground black, background white (matching prior code)
            outImage.data[i * 4] = color;
            outImage.data[i * 4 + 1] = color;
            outImage.data[i * 4 + 2] = color;
            outImage.data[i * 4 + 3] = 255;
        }

        // Put mask into canvasOnnx (finalCanvas)
        finalCtx.putImageData(outImage, 0, 0);
        logMessage("Fona noņemšana pabeigta.");
        return true;
    } catch (err) {
        console.error("bgRemoval error:", err);
        logMessage("Kļūda fona noņemšanā: " + err.message);
        return false;
    }
}

xyButton.onclick = async () => {
